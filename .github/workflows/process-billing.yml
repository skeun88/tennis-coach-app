name: 💳 Process Billing — Daily Subscription Charge

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 09:00 KST (00:00 UTC)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  process-billing:
    name: 💰 Run Billing
    runs-on: ubuntu-latest
    steps:
      - name: Call process-billing Edge Function
        id: billing
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/process-billing" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "status=$HTTP_CODE" >> $GITHUB_OUTPUT
          echo "body=$HTTP_BODY" >> $GITHUB_OUTPUT

          echo "📋 Response (HTTP $HTTP_CODE):"
          echo "$HTTP_BODY" | python3 -m json.tool || echo "$HTTP_BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Billing function failed with HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Parse and report results
        if: success()
        run: |
          BODY='${{ steps.billing.outputs.body }}'
          PROCESSED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('processed', 0))" 2>/dev/null || echo "?")
          echo "✅ 처리된 구독: ${PROCESSED}건"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *[구독 결제]* 일일 자동결제 완료\n처리: ${{ steps.billing.outputs.body }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚨 *[구독 결제 실패]* 일일 자동결제 오류 발생!\nHTTP: ${{ steps.billing.outputs.status }}\n즉시 확인 필요!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
