name: 🗄️ DB Migration — Apply Supabase Migrations

on:
  workflow_dispatch:  # 수동 트리거만 (migration 배포할 때만 GitHub Actions에서 버튼 클릭)

jobs:
  migrate:
    name: 📦 Apply DB Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run migrations via psql
        run: |
          for file in supabase/migrations/*.sql; do
            echo "▶ Applying: $file"
            psql "$DATABASE_URL" -f "$file" && echo "✅ Done: $file" || echo "⚠️ Already applied or skipped: $file"
          done
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.luhuiwyhewofjxnbzbdt.supabase.co:5432/postgres?sslmode=require

      - name: Install Supabase CLI
        run: |
          mkdir -p "$HOME/.local/share/supabase"
          curl -sL https://github.com/supabase/cli/releases/download/v2.103.0/supabase_2.103.0_linux_amd64.tar.gz \
            | tar -xzf - -C "$HOME/.local/share/supabase"
          echo "$HOME/.local/share/supabase" >> $GITHUB_PATH
          "$HOME/.local/share/supabase/supabase" --version

      - name: Deploy Edge Functions
        run: |
          supabase link --project-ref luhuiwyhewofjxnbzbdt
          supabase functions deploy issue-billing-key --no-verify-jwt
          supabase functions deploy process-billing --no-verify-jwt
          supabase functions deploy upgrade-subscription
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Edge Function secrets
        run: |
          supabase secrets set TOSS_SECRET_KEY="${{ secrets.TOSS_SECRET_KEY }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "✅ *[DB 마이그레이션]* Supabase 배포 완료 — ${{ github.ref_name }}"}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "❌ *[DB 마이그레이션 실패]* 확인 필요! — ${{ github.ref_name }}"}
