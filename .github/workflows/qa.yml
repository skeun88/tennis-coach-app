name: QA — Coach App

on:
  workflow_dispatch:  # 수동 트리거 (QA 체크만)

jobs:
  qa:
    name: 🧪 QA Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        run: npx eslint . --ext .ts,.tsx --max-warnings 0 || true
